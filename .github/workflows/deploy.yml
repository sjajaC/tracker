name: Deploy to GitHub Pages

# Tek dal akışı: bu dala her push'ta otomatik yayınla.
# Manuel tetikleme de mümkün (Actions sekmesi → Run workflow).
on:
  push:
    branches: [claude/mobile-habit-tracker-3h2lh2]
  workflow_dispatch:

# Pages'e deploy için gerekli izinler
permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek bir deploy çalışsın; sıradakini iptal etme (yayını yarıda kesmeyelim)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # GitHub Pages projeyi /<repo-adı>/ alt yolunda servis eder
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages henüz açık değilse otomatik etkinleştirmeyi dener
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
